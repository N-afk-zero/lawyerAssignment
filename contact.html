<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us | Abdallah Law Firm</title>
<meta name="description" content="Contact Abdallah, barrister, in Port Louis, Mauritius. Phone, email, address and consultation form.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/contact.css">
<script src="js/main.js" defer></script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<main id="main">
<section class="ptitle"><div class="wrap"><p class="eyebrow">Get in touch</p><h1>Contact Us</h1></div></section>
<section style="padding-top:1rem"><div class="wrap c-wrap">
<aside class="c-info reveal"><h2>Chambers</h2><ul class="list"><li><b>Address:</b> Cyber Tower 1, Ebene</li><li><b>Phone:</b> <a href="tel:+23057995620">+230 5799 5620</a></li><li><b>Email:</b> <a href="mailto:abdallah@gmail.com">abdallah@gmail.com</a></li></ul></aside>
<div class="c-form reveal"><h2>Request a consultation</h2>
<form class="form" id="cform" novalidate>
<div><label for="name">Full name</label><input id="name" name="name" autocomplete="name"><span class="err" id="e-name" role="alert"></span></div>
<div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><span class="err" id="e-email" role="alert"></span></div>
<div><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel"><span class="err" id="e-phone" role="alert"></span></div>
<div><label for="area">Practice area</label><select id="area" name="area"></select><span class="err" id="e-area" role="alert"></span></div>
<div><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><span class="err" id="e-message" role="alert"></span></div>
<div><label class="chk" for="consent"><input type="checkbox" id="consent" name="consent"> I consent to being contacted about my enquiry.</label><span class="err" id="e-consent" role="alert"></span></div>
<button class="btn" type="submit">Send message</button>
<p class="ok" tabindex="-1" role="status">Thank you. Your message has been received and we will be in touch shortly. (Demo only: no data is sent.)</p></form></div></div></section>
<section class="alt"><div class="wrap reveal"><iframe class="map" title="Google Map showing Cyber Tower 1, Ébène, Mauritius" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen src="https://www.google.com/maps?q=-20.2452272,57.4918101&z=17&hl=en&output=embed"></iframe><a class="map-link" href="https://maps.app.goo.gl/NpwpGJmxxMKyq3Kp7" target="_blank" rel="noopener">Open in Google Maps →</a></div></section>
</main>
<footer class="site-footer" id="site-footer"></footer>
</body>
</html>
